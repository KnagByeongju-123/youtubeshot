<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/","@pixiv/three-vrm":"./node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"}}</script>
</head><body>
<script type="module">
// 애니풍 3D 아나운서 안내 장면 (다큐 진행자 샘플, 2026-11-25)
//   아나운서(GLB)가 오른쪽에서 걸어 들어와 → 몸을 돌려 카메라를 보고 → 뒤 화면(사진)을 손으로 가리키며 말함 →
//   두 손 펴 설명하는 자세 → 검지 하나 세우는 자세. 만화풍 색칠(셀 그림자 2~3단 + 윤곽선)
//   사용: MODEL="glb=여자아나운서_리깅&lip=output/애니아나운서/lip.json&photo=output/애니아나운서/taung_photo.jpg&cap=<화면 아래 글>"
//         node 애니3D/촬영.js 애니3D/장면_아나운서_안내.html <폴더> <장수>
//   lip = 애니3D/입모양_프레임.py 결과 (--시작 = 말 시작 초, 기본 3.0 에 맞춘 동작 시간표)
//   real=1 : 만화풍 대신 원래 색(사실풍 비교용)
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { loadHuman } from './glb_사람.js';

const W = 1280, H = 720, FPS = 24;
const Q = new URLSearchParams(location.search);
const TOON = Q.get('real') !== '1';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(+Q.get('ss') || 1); renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();

// ── 셀 그림자(2~3단) 재료와 먹선(뒷면 껍질) ──
const steps = new Uint8Array([110, 190, 255]); const grad = new THREE.DataTexture(steps, 3, 1, THREE.RedFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const toon = (c, extra = {}) => new THREE.MeshToonMaterial({ color: c, gradientMap: grad, ...extra });
const inkMat = new THREE.MeshBasicMaterial({ color: 0x23202a, side: THREE.BackSide });
function ink(mesh, k = 1.03) { const o = new THREE.Mesh(mesh.geometry, inkMat); o.scale.setScalar(k); mesh.add(o); return mesh; }

// ── 스튜디오 (애니풍): 뒤 벽·바닥·큰 화면·옆 빛기둥 ──
const wallTex = (() => { const c = document.createElement('canvas'); c.width = 16; c.height = 256; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#1d2b4f'); gr.addColorStop(0.6, '#2f4775'); gr.addColorStop(1, '#4a6aa0');
  g.fillStyle = gr; g.fillRect(0, 0, 16, 256); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
scene.background = wallTex;
const wall = new THREE.Mesh(new THREE.PlaneGeometry(30, 8), new THREE.MeshBasicMaterial({ map: wallTex })); wall.position.set(0, 4, -2.2); scene.add(wall);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 12), toon(0x9aa7c2)); floor.rotation.x = -Math.PI / 2; floor.position.z = 2; scene.add(floor);
const floorLine = new THREE.Mesh(new THREE.PlaneGeometry(30, 0.04), new THREE.MeshBasicMaterial({ color: 0x6fd3ff })); floorLine.rotation.x = -Math.PI / 2; floorLine.position.set(0, 0.003, -1.2); scene.add(floorLine);
for (const x of [-3.6, -2.9, 2.9, 3.6]) {          // 옆 빛기둥
  const p = new THREE.Mesh(new THREE.BoxGeometry(0.12, 3.6, 0.12), new THREE.MeshBasicMaterial({ color: 0x8fe3ff })); p.position.set(x, 1.8, -2.0); scene.add(p);
}
// 큰 화면: 사진 + 아래 글 띠
const SCR = { x: -1.05, y: 1.42, w: 1.9, h: 1.07, z: -1.7 };
const frame = new THREE.Mesh(new THREE.BoxGeometry(SCR.w + 0.1, SCR.h + 0.1, 0.06), toon(0x1a1d26)); frame.position.set(SCR.x, SCR.y, SCR.z - 0.04); scene.add(ink(frame, 1.01));
const scrCanvas = document.createElement('canvas'); scrCanvas.width = 1280; scrCanvas.height = 720;
const scrTex = new THREE.CanvasTexture(scrCanvas); scrTex.colorSpace = THREE.SRGBColorSpace;
const screen = new THREE.Mesh(new THREE.PlaneGeometry(SCR.w, SCR.h), new THREE.MeshBasicMaterial({ map: scrTex, toneMapped: false })); screen.position.set(SCR.x, SCR.y, SCR.z); scene.add(screen);
async function drawScreen() {
  const g = scrCanvas.getContext('2d'); g.fillStyle = '#0d1424'; g.fillRect(0, 0, 1280, 720);
  if (Q.get('photo')) {
    const img = new Image(); img.src = '../' + Q.get('photo'); await img.decode();
    const s = Math.max(1280 / img.width, 720 / img.height), w = img.width * s, h = img.height * s;
    g.drawImage(img, (1280 - w) / 2, (720 - h) / 2 - 40, w, h);
  }
  const cap = Q.get('cap') || '';
  if (cap) {
    g.fillStyle = 'rgba(10,18,40,0.82)'; g.fillRect(0, 600, 1280, 120);
    g.fillStyle = '#e8394a'; g.fillRect(0, 600, 14, 120);
    g.fillStyle = '#ffffff'; g.font = 'bold 58px "NanumBarunGothic","NanumGothic","Noto Sans CJK KR",sans-serif'; g.textBaseline = 'middle';
    g.fillText(cap, 44, 662);
  }
  scrTex.needsUpdate = true;
}
await drawScreen();

scene.add(new THREE.AmbientLight(0xffffff, TOON ? 0.85 : 0.6));
scene.add(new THREE.HemisphereLight(0xffffff, 0x5a6a88, TOON ? 0.4 : 1.0));
const key = new THREE.DirectionalLight(0xfff2e4, TOON ? 1.5 : 1.8); key.position.set(-1.5, 3, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.5); fill.position.set(2, 1.5, 2.5); scene.add(fill);

// ── 아나운서 ──
const human = await loadHuman(new GLTFLoader(), '../models/glb/' + (Q.get('glb') || '여자아나운서_리깅') + '.glb', { height: +Q.get('height') || 1.65 });
scene.add(human.scene);
if (TOON) {           // 원래 재료(사진 같은 색)를 셀 그림자 재료로 바꾸고, 겉에 먹선 껍질을 씌움
  const skip = /teeth|tooth|eye|lash|tongue|mouth/i;
  const list = []; human.scene.traverse((o) => { if (o.isMesh) list.push(o); });
  for (const o of list) {
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const nm = mats.map((m) => new THREE.MeshToonMaterial({ map: m.map || null, color: m.color ? m.color.clone() : 0xffffff, gradientMap: grad,
      transparent: m.transparent, alphaTest: m.alphaTest, side: m.side, opacity: m.opacity }));
    o.material = Array.isArray(o.material) ? nm : nm[0];
    if (skip.test(o.name) || mats.some((m) => m.transparent) || !o.isSkinnedMesh) continue;
    const om = new THREE.MeshBasicMaterial({ color: 0x2a2026, side: THREE.BackSide });
    const T = (+Q.get('line') || 0.0035) / human.scale;     // 선 굵기(m)를 모델 단위로
    om.onBeforeCompile = (sh) => { sh.vertexShader = sh.vertexShader.replace('#include <project_vertex>', `transformed += normalize(objectNormal) * ${T.toFixed(6)};\n#include <project_vertex>`); };
    const sk = new THREE.SkinnedMesh(o.geometry, om); sk.bind(o.skeleton, o.bindMatrix);
    if (o.morphTargetInfluences) { sk.morphTargetInfluences = o.morphTargetInfluences; sk.morphTargetDictionary = o.morphTargetDictionary; }
    sk.frustumCulled = false; o.parent.add(sk); sk.position.copy(o.position); sk.quaternion.copy(o.quaternion); sk.scale.copy(o.scale);
  }
}
const lip = Q.get('lip') ? await (await fetch('../' + Q.get('lip'))).json() : { frames: [] };
const legLen = human.legLength();
for (const s of ['left', 'right']) for (const f of ['Index', 'Middle', 'Ring', 'Little', 'Thumb']) human.curl(s + f, f === 'Thumb' ? 0.15 : 0.3);
window.READY = true;

const ease = (a, b, t) => { const x = Math.min(1, Math.max(0, (t - a) / (b - a))); return x * x * (3 - 2 * x); };
const on = (a, b, t, r = 0.45) => ease(a, a + r, t) - ease(b - r, b, t);
const bone = (n) => human.humanoid.getNormalizedBoneNode(n);
const em = human.expressionManager;

// 시간표 (말 시작 3.0초 기준)
const WALK_END = 2.9, TURN = [2.7, 3.5];
const PT = [4.0, 6.7];        // 화면 가리키기 ('이름표였던 이 아이')
const OPEN = [7.4, 10.3];     // 두 손 펴 설명 ('그런데 그 종이라고 확실히 부를 수 있는 화석은')
const ONE = [10.6, 12.9];     // 검지 하나 ('사실 이 아이 하나뿐')
const CYC = 1.1, SWING = 0.2, KNEE = 0.3;
const speed = 2 * 2 * legLen * Math.sin(SWING) / CYC;
const X_END = 0.62, X0 = X_END + speed * WALK_END;

function pose(t) {
  for (const n of ['leftUpperArm', 'rightUpperArm', 'leftLowerArm', 'rightLowerArm', 'leftHand', 'rightHand', 'leftUpperLeg', 'rightUpperLeg',
    'leftLowerLeg', 'rightLowerLeg', 'leftFoot', 'rightFoot', 'hips', 'chest', 'spine', 'head', 'neck']) { bone(n).rotation.set(0, 0, 0); }
  for (const s of ['left', 'right']) for (const f of ['Index', 'Middle', 'Ring', 'Little', 'Thumb']) human.curl(s + f, f === 'Thumb' ? 0.15 : 0.3);
  // 걷기 (끝날 때 0.4초 동안 동작을 줄여 멈춤)
  const wk = 1 - ease(WALK_END - 0.4, WALK_END + 0.1, t);
  const ph = 2 * Math.PI * Math.min(t, WALK_END) / CYC, s = Math.sin(ph), c = Math.cos(ph);
  bone('leftUpperLeg').rotation.x = -SWING * s * wk; bone('rightUpperLeg').rotation.x = SWING * s * wk;
  bone('leftLowerLeg').rotation.x = (0.1 + KNEE * Math.max(0, c)) * wk; bone('rightLowerLeg').rotation.x = (0.1 + KNEE * Math.max(0, -c)) * wk;
  bone('leftUpperArm').rotation.set(0.32 * s * wk, 0, -0.06); bone('rightUpperArm').rotation.set(-0.32 * s * wk, 0, 0.06);
  bone('leftLowerArm').rotation.x = -0.15 - 0.15 * wk; bone('rightLowerArm').rotation.x = -0.15 - 0.15 * wk;
  const hips = bone('hips'); hips.position.y = (0.022 * Math.cos(2 * ph) - 0.02) * wk; hips.rotation.y = 0.08 * s * wk;
  bone('chest').rotation.y = -0.12 * s * wk;
  // 숨쉬기
  bone('chest').rotation.x = 0.014 * Math.sin(t * 2 * Math.PI / 3.6);

  // ① 화면 가리키기: 오른팔을 옆·앞으로 들고 검지로, 고개·가슴은 화면 쪽
  const p = on(PT[0], PT[1], t, 0.55);
  bone('rightUpperArm').rotation.z += -0.95 * p; bone('rightUpperArm').rotation.x += -0.45 * p;
  bone('rightLowerArm').rotation.x += -0.25 * p; bone('rightLowerArm').rotation.y += 0.6 * p;
  if (p > 0) { for (const f of ['Middle', 'Ring', 'Little']) human.curl('right' + f, 0.3 + 1.05 * p); human.curl('rightThumb', 0.15 + 0.8 * p); human.curl('rightIndex', 0.3 - 0.3 * p); }
  const look = on(PT[0] - 0.1, PT[1] - 0.6, t, 0.5);
  bone('head').rotation.y += -0.45 * look; bone('chest').rotation.y += -0.18 * look; bone('head').rotation.x += 0.05 * look;

  // ② 두 손 펴 설명: 팔꿈치 굽혀 손을 몸 앞으로, 손바닥 위로, 천천히 벌렸다 모음
  const o = on(OPEN[0], OPEN[1], t, 0.55), sway = Math.sin((t - OPEN[0]) * 2.2) * 0.08;
  for (const [sd, sg] of [['left', 1], ['right', -1]]) {
    bone(sd + 'UpperArm').rotation.x += -0.22 * o; bone(sd + 'UpperArm').rotation.z += sg * (0.14 + sway) * o;
    bone(sd + 'LowerArm').rotation.x += -0.8 * o; bone(sd + 'LowerArm').rotation.y += sg * +(+Q.get('tw') || 1.0) * o;
    if (o > 0) for (const f of ['Index', 'Middle', 'Ring', 'Little']) human.curl(sd + f, 0.3 - 0.2 * o);
  }
  bone('head').rotation.z += 0.04 * o * Math.sin((t - OPEN[0]) * 1.3);

  // ③ 검지 하나: 오른손을 가슴 높이로 올려 검지만 세움, 고개 살짝 끄덕
  const n1 = on(ONE[0], ONE[1], t, 0.5);
  bone('rightUpperArm').rotation.x += -0.4 * n1; bone('rightUpperArm').rotation.z += -0.12 * n1;
  bone('rightLowerArm').rotation.x += -1.75 * n1; bone('rightLowerArm').rotation.y += 0.3 * n1;
  if (n1 > 0) { for (const f of ['Middle', 'Ring', 'Little']) human.curl('right' + f, 0.3 + 1.05 * n1); human.curl('rightThumb', 0.15 + 0.8 * n1); human.curl('rightIndex', 0.3 - 0.3 * n1); }
  bone('head').rotation.x += 0.06 * Math.max(0, Math.sin((t - ONE[0]) * 4)) * n1;

  // 말할 때 고개를 아주 조금
  const talk = ease(3.1, 3.4, t);
  bone('head').rotation.x += talk * 0.02 * Math.sin(t * 1.7); bone('head').rotation.y += talk * 0.025 * Math.sin(t * 0.9 + 1);
}

let lastLog = '';
window.renderFrame = (i) => {
  const t = i / FPS;
  pose(t);
  // 몸의 자리·방향: 오른쪽(+x)에서 왼쪽으로 걸어오다 멈추고 카메라 쪽(+z)으로 돎
  const x = t < WALK_END ? X0 - speed * t : X_END;
  human.scene.position.set(x, 0, 0);
  human.scene.rotation.y = -Math.PI / 2 * (1 - ease(TURN[0], TURN[1], t));
  // 입·눈
  const lf = lip.frames[i]; em.setValue('MouthOpen', lf ? lf[0] : 0); em.setValue('MouthWide', lf ? lf[1] : 0); em.setValue('MouthRound', lf ? lf[2] : 0);
  const blink = (c) => Math.max(0, 1 - Math.abs(t - c) / 0.07);
  em.setValue('Blink', Math.max(blink(1.6), blink(4.9), blink(8.2), blink(11.7)));
  human.update();
  // 카메라: 처음엔 넓게(걸어 들어오는 모습) → 천천히 다가가며 살짝 돎
  const k = ease(2.6, 13.5, t), k0 = ease(0, 2.6, t);
  const cx = 0.2 - 0.25 * k0 + 0.45 * k, cy = 1.25 - 0.05 * k, cz = 5.0 - 1.6 * k;
  camera.position.set(cx, cy, cz); camera.lookAt(-0.1 + 0.25 * k, 1.12 + 0.02 * k, 0);
  renderer.render(scene, camera);
};
const camera = new THREE.PerspectiveCamera(32, W / H, 0.05, 80);
</script></body></html>
