<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three'; import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); r.setSize(1280,720); r.outputColorSpace=THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const s=new THREE.Scene(); s.background=new THREE.Color(0xdddddd); s.add(new THREE.AmbientLight(0xffffff,1.2)); const d=new THREE.DirectionalLight(0xffffff,1.5); d.position.set(1,2,3); s.add(d);
const cam=new THREE.PerspectiveCamera(30,16/9,0.01,100);
new GLTFLoader().load('../models/glb/announcer.glb',g=>{ s.add(g.scene); g.scene.updateMatrixWorld(true);
 const b=new THREE.Box3().setFromObject(g.scene); const c=b.getCenter(new THREE.Vector3()), z=b.getSize(new THREE.Vector3());
 const info={size:z.toArray(),center:c.toArray(),bones:{}};
 g.scene.traverse(o=>{ if(o.isBone){ const p=o.getWorldPosition(new THREE.Vector3()); info.bones[o.name]=p.toArray().map(v=>+v.toFixed(3)); }});
 window.INFO=info; console.log(JSON.stringify(info)); window.G=g;
 window.renderFrame=(view)=>{ const k=z.y*1.9; const a=[0,Math.PI/2,Math.PI][view]; cam.position.set(c.x+Math.sin(a)*k,c.y,c.z+Math.cos(a)*k); cam.lookAt(c); r.render(s,cam); };
 window.READY=true; });
</script></body></html>
