<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// 리깅 검사 장면 (21초): 팔 앞으로 들기 → 옆으로 들기(T) → 팔꿈치 굽히기 → 오른손 흔들기 → 주먹 쥐기·펴기 → 검지 가리키기 → 엄지 척 → 무릎 들기(왼·오른)
//   사용: MODEL=glb=announcer_rig node 애니3D/촬영.js 애니3D/장면_동작검사.html <폴더> 504
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { loadHuman } from './glb_사람.js';

const W = 1280, H = 720, FPS = 24;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xd8dde6);
scene.add(new THREE.HemisphereLight(0xffffff, 0x99a0aa, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(1.5, 3, 3); scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(4, 48), new THREE.MeshLambertMaterial({ color: 0xb9c0cc })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const camera = new THREE.PerspectiveCamera(30, W / H, 0.05, 50);
const Q = new URLSearchParams(location.search);
const loader = new GLTFLoader();
const human = await loadHuman(loader, '../models/glb/' + (Q.get('glb') || 'announcer_rig') + '.glb');
scene.add(human.scene); window.READY = true;

const ease = (a, b, t) => { const x = Math.min(1, Math.max(0, (t - a) / (b - a))); return x * x * (3 - 2 * x); };
const on = (a, b, t, r = 0.5) => ease(a, a + r, t) - ease(b - r, b, t);       // a~b 동안 켜졌다 꺼짐
const bone = (n) => human.humanoid.getNormalizedBoneNode(n);
const LABELS = [[0, '쉬는 자세'], [1, '팔 앞으로'], [3.2, '팔 옆으로(T)'], [5.4, '팔꿈치 굽히기'], [7.6, '오른손 흔들기'],
  [10, '주먹 쥐기·펴기'], [12.4, '검지 가리키기'], [14.2, '엄지 척'], [16.2, '무릎 들기']];

window.renderFrame = (i) => {
  const t = i / FPS;
  for (const n of ['leftUpperArm', 'rightUpperArm', 'leftLowerArm', 'rightLowerArm', 'leftHand', 'rightHand']) { bone(n).rotation.set(0, 0, 0); }
  // 1~3초: 팔 앞으로 (어깨에서 앞으로 들어 올림)
  const fw = on(1, 3, t);
  bone('leftUpperArm').rotation.x -= 1.35 * fw; bone('rightUpperArm').rotation.x -= 1.35 * fw;
  // 3.2~5.2초: 옆으로 T
  const side = on(3.2, 5.2, t);
  bone('leftUpperArm').rotation.z += 1.25 * side; bone('rightUpperArm').rotation.z -= 1.25 * side;
  // 5.4~7.4초: 팔꿈치 굽히기 (손이 가슴 앞으로)
  const el = on(5.4, 7.4, t);
  bone('leftUpperArm').rotation.x -= 0.35 * el; bone('rightUpperArm').rotation.x -= 0.35 * el;
  bone('leftLowerArm').rotation.x -= 1.9 * el; bone('rightLowerArm').rotation.x -= 1.9 * el;
  // 7.6~9.8초: 오른손 흔들기 (위팔 옆으로, 아래팔 위로, 아래팔만 좌우)
  const wv = on(7.6, 9.8, t);
  bone('rightUpperArm').rotation.z -= 1.1 * wv;
  bone('rightLowerArm').rotation.z -= wv * (1.5 + 0.35 * Math.sin((t - 7.6) * 2 * Math.PI * 1.6));
  // 10~16초: 손 검사 — 두 손을 앞으로(팔꿈치 굽혀 손을 몸 앞에)
  const hd = ease(9.8, 10.3, t);
  bone('leftUpperArm').rotation.x -= 0.3 * hd; bone('rightUpperArm').rotation.x -= 0.3 * hd;
  bone('leftLowerArm').rotation.x -= 1.5 * hd; bone('rightLowerArm').rotation.x -= 1.5 * hd;
  for (const s of ['left', 'right']) for (const f of ['Thumb', 'Index', 'Middle', 'Ring', 'Little']) human.curl(s + f, 0);
  const fist = on(10.4, 12.2, t, 0.6);
  human.fist('left', 1.35 * fist); human.fist('right', 1.35 * fist);
  const pt = on(12.4, 14, t);           // 검지만 펴고 나머지는 쥠
  if (pt > 0) for (const s of ['left', 'right']) { for (const f of ['Thumb', 'Middle', 'Ring', 'Little']) human.curl(s + f, 1.35 * pt * (f === 'Thumb' ? 0.7 : 1)); }
  const up = on(14.2, 16, t);           // 엄지 척: 네 손가락 쥐고 엄지는 폄
  if (up > 0) for (const s of ['left', 'right']) { for (const f of ['Index', 'Middle', 'Ring', 'Little']) human.curl(s + f, 1.35 * up); human.curl(s + 'Thumb', -0.3 * up); }
  // 16.2~20.8초: 무릎 들기 (허벅지 앞으로, 무릎 굽힘) — 엉덩관절·무릎 위치 검사
  for (const n of ['leftUpperLeg', 'rightUpperLeg', 'leftLowerLeg', 'rightLowerLeg']) bone(n).rotation.set(0, 0, 0);
  const kl = on(16.4, 18.4, t), kr = on(18.6, 20.6, t);
  bone('leftUpperLeg').rotation.x = -1.2 * kl; bone('leftLowerLeg').rotation.x = 1.4 * kl;
  bone('rightUpperLeg').rotation.x = -1.2 * kr; bone('rightLowerLeg').rotation.x = 1.4 * kr;
  const back = ease(15.9, 16.4, t);           // 손을 내림
  for (const n of ['leftUpperArm', 'rightUpperArm', 'leftLowerArm', 'rightLowerArm']) bone(n).rotation.x *= (1 - back);
  // 숨쉬기·눈 깜빡임
  bone('chest').rotation.x = 0.015 * Math.sin(t * 2 * Math.PI / 3.5);
  human.expressionManager.setValue('blink', Math.max(0, 1 - Math.abs(t - 2.5) / 0.08, 1 - Math.abs(t - 8.7) / 0.08));
  human.update();
  // 카메라: 0~9.8초 전신 앞(조금 비스듬히), 그 뒤 손 가까이
  const c = ease(9.8, 10.6, t) - ease(15.9, 16.4, t);   // 16초 뒤 다시 전신 (옆에서 조금 더 비스듬히)
  const sd = ease(15.9, 16.4, t);
  camera.position.set(0.9 - 0.6 * c + 1.4 * sd, 1.15 - 0.05 * c - 0.2 * sd, 3.4 - 2.3 * c - 0.4 * sd); camera.lookAt(0, 1.05 - 0.05 * c - 0.2 * sd, 0);
  renderer.render(scene, camera);
  let lab = ''; for (const [s, l] of LABELS) if (t >= s) lab = l; document.title = lab;
};
</script></body></html>
