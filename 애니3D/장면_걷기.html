<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/","@pixiv/three-vrm":"./node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"}}</script>
</head><body>
<script type="module">
// 걷기 시험 장면: 캐릭터가 흙길을 따라 걸음 (0~4.5초 옆에서 따라가며, 4.5~8초 앞에서 다가오는 모습)
//   걷기 = 다리(위·아래)·팔을 번갈아 흔들고, 엉덩이가 한 걸음마다 살짝 오르내리고 좌우로 기울며, 몸 전체가 앞으로 나아감
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const W = 1280, H = 720, FPS = 24;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const sky = document.createElement('canvas'); sky.width = 16; sky.height = 256;
const g = sky.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
gr.addColorStop(0, '#3d7fd9'); gr.addColorStop(0.55, '#8cc6f2'); gr.addColorStop(1, '#e6f4ff');
g.fillStyle = gr; g.fillRect(0, 0, 16, 256);
const skyTex = new THREE.CanvasTexture(sky); skyTex.colorSpace = THREE.SRGBColorSpace; scene.background = skyTex;

const steps = new Uint8Array([90, 170, 255]); const grad = new THREE.DataTexture(steps, 3, 1, THREE.RedFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const toon = (c) => new THREE.MeshToonMaterial({ color: c, gradientMap: grad });
const inkMat = new THREE.MeshBasicMaterial({ color: 0x2a2228, side: THREE.BackSide });
function ink(mesh, k = 1.04) { const o = new THREE.Mesh(mesh.geometry, inkMat); o.scale.setScalar(k); mesh.add(o); return mesh; }
scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const sun = new THREE.DirectionalLight(0xfff3e0, 1.6); sun.position.set(2, 4, 3); scene.add(sun);

// 땅·흙길(x 방향으로 길게)·언덕·길가 나무·꽃·구름
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), toon(0x7cc45a)); ground.rotation.x = -Math.PI / 2; scene.add(ground);
const road = new THREE.Mesh(new THREE.PlaneGeometry(200, 1.6), toon(0xd9c08a)); road.rotation.x = -Math.PI / 2; road.position.y = 0.005; scene.add(road);
for (const [x, z, r, c] of [[-14, -22, 10, 0x5fae4a], [4, -26, 13, 0x6ab852], [22, -24, 11, 0x4f9a40], [38, -28, 14, 0x5fae4a]]) {
  const h = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 16), toon(c)); h.scale.y = 0.45; h.position.set(x, 0, z); scene.add(ink(h, 1.01));
}
function tree(x, z, s = 1) {
  const t = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12 * s, 0.16 * s, 1.4 * s, 12), toon(0x8a5a3a)); trunk.position.y = 0.7 * s; t.add(ink(trunk, 1.08));
  for (const [dx, dy, r] of [[0, 1.9, 0.75], [-0.45, 1.55, 0.55], [0.5, 1.6, 0.55]]) {
    const c = new THREE.Mesh(new THREE.SphereGeometry(r * s, 20, 14), toon(0x3f8f3a)); c.position.set(dx * s, dy * s, 0); t.add(ink(c, 1.03));
  }
  t.position.set(x, 0, z); scene.add(t);
}
for (let i = 0; i < 9; i++) tree(-6 + i * 3.4, -2.6 - (i % 3) * 0.9, 1.2 + (i % 2) * 0.4);   // 길 뒤쪽 가로수 (지나가며 움직임이 보이게)
const flowerCols = [0xffffff, 0xffd84d, 0xff9ec4];
for (let i = 0; i < 60; i++) {
  const f = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), toon(flowerCols[i % 3]));
  f.position.set(-8 + (i * 7.3) % 34, 0.05, (i % 2 ? 1 : -1) * (1.1 + ((i * 3.7) % 2.2))); scene.add(f);
}
const clouds = [];
for (const [x, y, z, s] of [[-6, 6.5, -20, 1.6], [5, 7.5, -24, 2.1], [16, 6, -26, 1.4], [28, 7, -25, 1.8]]) {
  const cl = new THREE.Group();
  for (const [dx, dy, r] of [[0, 0, 1], [-1.1, -0.2, 0.75], [1.1, -0.15, 0.8], [0.4, 0.45, 0.7]]) {
    const b = new THREE.Mesh(new THREE.SphereGeometry(r * s, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffffff })); b.position.set(dx * s, dy * s, 0); cl.add(b);
  }
  cl.position.set(x, y, z); scene.add(cl); clouds.push(cl);
}

const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 300);
let vrm = null, hip0 = 0, hipY = 0, legLen = 0.8;
const loader = new GLTFLoader(); loader.register((p) => new VRMLoaderPlugin(p));
loader.load('../models/vrm/' + (new URLSearchParams(location.search).get('model') || 'seed-san') + '.vrm', (gltf) => {
  vrm = gltf.userData.vrm; VRMUtils.rotateVRM0(vrm); scene.add(vrm.scene);
  vrm.scene.updateMatrixWorld(true);
  const p = (n) => vrm.humanoid.getNormalizedBoneNode(n).getWorldPosition(new THREE.Vector3());
  hip0 = p('hips').y; hipY = vrm.humanoid.getNormalizedBoneNode('hips').position.y;   // 엉덩이 원래 높이(여기에 오르내림을 더함)
  legLen = p('leftUpperLeg').y - p('leftFoot').y;      // 다리 길이 → 보폭 계산
  window.READY = true;
});

const ease = (a, b, t) => { const x = Math.min(1, Math.max(0, (t - a) / (b - a))); return x * x * (3 - 2 * x); };
const bone = (n) => vrm.humanoid.getNormalizedBoneNode(n);
const T = 1.1;            // 두 걸음(왼발·오른발) 한 번에 걸리는 시간(초)
const SWING = 0.42;       // 다리를 앞뒤로 벌리는 각도
function walk(t) {
  const ph = 2 * Math.PI * t / T, s = Math.sin(ph), c = Math.cos(ph);
  // 다리: 왼다리 앞(-) ↔ 뒤(+). 뒤로 가며 땅을 차고 앞으로 올 때 무릎을 굽힘
  bone('leftUpperLeg').rotation.x = -SWING * s;
  bone('rightUpperLeg').rotation.x = SWING * s;
  bone('leftLowerLeg').rotation.x = 0.15 + 0.55 * Math.max(0, c);     // 다리가 앞으로 올라올 때(앞→) 무릎 굽힘
  bone('rightLowerLeg').rotation.x = 0.15 + 0.55 * Math.max(0, -c);
  bone('leftFoot').rotation.x = -0.15 * s; bone('rightFoot').rotation.x = 0.15 * s;
  // 팔: 다리와 반대로 흔듦, 팔꿈치는 살짝 굽힘
  bone('leftUpperArm').rotation.set(0.38 * s, 0, -1.2); bone('rightUpperArm').rotation.set(-0.38 * s, 0, 1.2);
  bone('leftLowerArm').rotation.set(0, -0.3, -0.1); bone('rightLowerArm').rotation.set(0, 0.3, 0.1);
  // 엉덩이: 한 걸음마다 두 번 오르내림, 좌우로 살짝 비틀림 / 가슴은 반대로 비틀어 균형
  const hips = bone('hips');
  hips.position.y = hipY + 0.022 * Math.cos(2 * ph) - 0.02;
  hips.rotation.y = 0.08 * s; hips.rotation.z = 0.03 * Math.cos(ph);
  bone('chest').rotation.y = -0.12 * s; bone('spine').rotation.x = 0.06;
  bone('head').rotation.y = 0.05 * s;
}
const speed = () => 2 * 2 * legLen * Math.sin(SWING) / T;   // 한 주기에 두 걸음 → 발이 미끄러지지 않을 속도

let last = -1;
window.renderFrame = (i) => {
  const t = i / FPS;
  walk(t);
  const em = vrm.expressionManager;
  const blink = (c) => Math.max(0, 1 - Math.abs(t - c) / 0.07);
  em.setValue('blink', Math.max(blink(1.3), blink(3.9), blink(6.2)));
  em.setValue('relaxed', 0.5);                                   // 기분 좋은 얼굴
  const x = -4 + speed() * t;                                    // 캐릭터는 +x 쪽으로 걸음
  vrm.scene.position.set(x, 0, 0); vrm.scene.rotation.y = Math.PI / 2;
  vrm.update(last < 0 ? 0 : 1 / FPS); last = i;
  for (const c of clouds) c.position.x += 0.004;
  if (t < 4.5) {          // 샷 1: 옆에서 같은 빠르기로 따라감(전신)
    camera.position.set(x + 0.3, 1.0, 5.2); camera.lookAt(x + 0.3, 0.8, 0);
  } else {                // 샷 2: 앞(길 위)에서 다가오는 모습, 카메라도 천천히 뒤로
    const k = ease(4.5, 8, t);
    camera.position.set(x + 3.6 - 0.4 * k, 1.15, 1.6); camera.lookAt(x, 0.95, 0);
  }
  renderer.render(scene, camera);
};
</script></body></html>
