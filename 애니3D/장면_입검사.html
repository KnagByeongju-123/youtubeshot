<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/","@pixiv/three-vrm":"./node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"}}</script>
</head><body>
<script type="module">
// 입 검사 장면 (얼굴 가까이): 0~6초 입 모양 하나씩(벌림 → 옆으로 → 오므림 → 턱 → 눈 깜빡임), 6.5초부터 나레이션에 맞춰 말하기
//   사용: MODEL="glb=<모델>&lip=<입모양.json>&height=1.75" node 애니3D/촬영.js 애니3D/장면_입검사.html <폴더> <장수>
//         입모양.json = 애니3D/입모양_프레임.py <시각.json> <결과> --시작 6.5  (소리도 6.5초에서 시작하게 붙임)
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { loadHuman } from './glb_사람.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const W = 1280, H = 720, FPS = 24;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2b3445);
scene.add(new THREE.HemisphereLight(0xffffff, 0x556070, 1.5));
const key = new THREE.DirectionalLight(0xfff4e8, 1.8); key.position.set(-1.2, 2.2, 3); scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.7); fill.position.set(1.5, 1.2, 2); scene.add(fill);
const camera = new THREE.PerspectiveCamera(22, W / H, 0.05, 50);
const Q = new URLSearchParams(location.search);
// VRM(VRoid) 캐릭터: ?model=<이름> (models/vrm/<이름>.vrm) — 입은 VRoid 의 aa·ih·ou·ee·oh 로
let human, VRM = null;
if (Q.get('model')) {
  const ld = new GLTFLoader(); ld.register((p) => new VRMLoaderPlugin(p));
  const g = await ld.loadAsync('../models/vrm/' + Q.get('model') + '.vrm'); VRM = g.userData.vrm; VRMUtils.rotateVRM0(VRM);
  scene.add(VRM.scene);
  human = { scene: VRM.scene, humanoid: VRM.humanoid, expressionManager: VRM.expressionManager, update: () => VRM.update(1 / 24), curl() {},
            prox: { head: { b: VRM.humanoid.getNormalizedBoneNode('head') } } };
  for (const s of ['left', 'right']) { VRM.humanoid.getNormalizedBoneNode(s + 'UpperArm').rotation.z = s === 'left' ? -1.2 : 1.2; }
  human.update(); VRM.scene.updateMatrixWorld(true);
} else {
  human = await loadHuman(new GLTFLoader(), '../models/glb/' + (Q.get('glb') || 'model2_rig_lip') + '.glb', { height: +Q.get('height') || 1.75 });
  scene.add(human.scene); human.update(); human.scene.updateMatrixWorld(true);
}
if (Q.get('hide')) human.scene.traverse((o) => { if (o.name && Q.get('hide').split(',').some((h) => o.name.startsWith(h))) o.visible = false; });   // 검사용: 이름으로 숨김
const lip = Q.get('lip') ? await (await fetch('../' + Q.get('lip'))).json() : { frames: [] };
const headPos = human.prox.head.b.getWorldPosition(new THREE.Vector3());
for (const s of ['left', 'right']) for (const f of ['Index', 'Middle', 'Ring', 'Little', 'Thumb']) human.curl(s + f, f === 'Thumb' ? 0.15 : 0.3);
window.READY = true;

const ease = (a, b, t) => { const x = Math.min(1, Math.max(0, (t - a) / (b - a))); return x * x * (3 - 2 * x); };
const on = (a, b, t, r = 0.3) => ease(a, a + r, t) - ease(b - r, b, t);
const bone = (n) => human.humanoid.getNormalizedBoneNode(n);
const em = human.expressionManager;
const CY = Q.get('cy') !== null ? +Q.get('cy') : 0.02;   // 카메라 높이(머리 뼈 기준, m) — 얼굴마다 입이 화면 가운데 아래에 오게
window.renderFrame = (i) => {
  const t = i / FPS;
  let open = 0, wide = 0, round = 0, jaw = 0;
  open = on(1.2, 2.2, t); wide = on(2.3, 3.3, t); round = on(3.4, 4.4, t); jaw = on(4.5, 5.5, t) * 0.18;
  const lf = lip.frames[i];
  if (lf) { open = Math.max(open, lf[0]); wide = Math.max(wide, lf[1]); round = Math.max(round, lf[2]); jaw = Math.max(jaw, lf[0] * 0.09); }
  if (VRM) {        // VRoid 다섯 입 모양: 처음 6초는 아·이·우·에·오 하나씩, 그 뒤는 말하기
    const demo = ['aa', 'ih', 'ou', 'ee', 'oh'].map((n, k) => on(1.0 + k * 0.9, 1.8 + k * 0.9, t, 0.2));
    ['aa', 'ih', 'ou', 'ee', 'oh'].forEach((n, k) => em.setValue(n, Math.max(demo[k], lf ? lf[3 + k] || 0 : 0)));
  } else { em.setValue('MouthOpen', open); em.setValue('MouthWide', wide); em.setValue('MouthRound', round); }
  if (Q.get('jaw') === '1') bone('jaw').rotation.x = jaw;       // 턱 뼈: 아래·뒤로 열림 (턱 뼈 무게가 제대로인 모델만 — 남자 아나운서는 코까지 붙어 있어 안 씀)
  const blink = (c) => Math.max(0, 1 - Math.abs(t - c) / 0.07);
  em.setValue(VRM ? 'blink' : 'Blink', Math.max(blink(5.75), blink(6.05), blink(9.3), blink(13.1), blink(16.8)));
  // 말할 때 고개를 아주 조금 움직임 (사람처럼)
  const talk = t > 6.4 ? 1 : 0;
  bone('head').rotation.x = talk * 0.025 * Math.sin(t * 1.7); bone('head').rotation.y = talk * 0.03 * Math.sin(t * 0.9 + 1);
  bone('chest').rotation.x = 0.012 * Math.sin(t * 2 * Math.PI / 3.6);
  human.update();
  camera.position.set(headPos.x + 0.05, headPos.y + CY + 0.01, headPos.z + 0.75); camera.lookAt(headPos.x, headPos.y + CY, headPos.z);
  renderer.render(scene, camera);
};
</script></body></html>
